# Dit à Prometheus de récupérer les métriques de JobRadar sur /actuator/prometheus
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: jobradar-backend
  namespace: jobradar
spec:
  selector:
    matchLabels: { app: jobradar-backend }
  endpoints:
    - port: http
      path: /actuator/prometheus
      interval: 15s
