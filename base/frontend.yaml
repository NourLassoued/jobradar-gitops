# Frontend Angular (nginx) + Ingress
apiVersion: apps/v1
kind: Deployment
metadata:
  name: jobradar-frontend
  namespace: jobradar
  labels: { app: jobradar-frontend }
spec:
  replicas: 1
  selector:
    matchLabels: { app: jobradar-frontend }
  template:
    metadata:
      labels: { app: jobradar-frontend }
    spec:
      containers:
        - name: frontend
          image: ghcr.io/nourlassoued/jobradar-frontend:sha-e7f329f
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: http }
            periodSeconds: 10
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { memory: 128Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: jobradar-frontend
  namespace: jobradar
spec:
  selector: { app: jobradar-frontend }
  ports:
    - name: http
      port: 80
      targetPort: http
---
# k3d inclut Traefik : l'application sera sur http://localhost:8081
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: jobradar
  namespace: jobradar
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: jobradar-frontend
                port: { number: 80 }
